# @package _global_

defaults:
  - override /data: demo_synthetic
  - override /model: demo_tiny_fastwam
  - _self_

output_dir: ./runs/demo_tiny_fastwam/tiny_train

batch_size: 8
num_workers: 0
pin_memory: false
persistent_workers: false

lr_scheduler_type: "constant"
learning_rate: 3.0e-3
num_epochs: 100
max_steps: 60
log_every: 10
save_every: 0
eval_every: 0
eval_num_inference_steps: 1

gradient_accumulation_steps: 1
mixed_precision: "no"
seed: 42
max_grad_norm: 1.0
weight_decay: 0.0
resume: null

wandb:
  enabled: false
  name: demo_tiny_fastwam
